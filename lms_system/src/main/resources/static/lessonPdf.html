<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comstream · Lesson materials</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="view">

    <!-- ============== Breadcrumb ============== -->
    <div class="lesson-breadcrumb">
        <span class="sep">/</span>
        <span class="current" id="lessonTitleCrumb">Lesson materials</span>
    </div>

    <!-- ============== Lesson identity banner ============== -->
    <div class="lesson-batch-banner" style="--batch-accent:#E4574B">
        <div class="lbb-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        </div>
        <div class="lbb-text">
            <p class="lbb-eyebrow">Lesson <span id="lessonNumberBadge">-</span> · <span id="lessonContextLine"></span></p>
            <h1 id="lessonTitleHeading">Lesson materials</h1>
            <p>PDF materials shared with students for this lesson.</p>
        </div>
        <div class="lbb-stats">
            <div class="lbb-stat"><b id="materialCount">0</b><span>Materials</span></div>
        </div>
    </div>

    <!-- ============== Materials list ============== -->
    <div class="material-list" id="materialList"></div>

    <!-- ============== Add material action bar ============== -->
    <div class="add-lesson-bar">
        <div class="add-lesson-summary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
            <span><strong id="materialCountBar">0</strong> materials for this lesson</span>
        </div>
        <button class="btn btn-primary btn-add-lesson" id="open-add-material" onclick="openAddLessonPdfModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            Add material
        </button>
    </div>

</section>

<!-- ============== Add material modal ============== -->
<div class="modal-overlay" id="material-modal-overlay">
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="material-modal-title">
        <div class="modal-head">
            <div>
                <h2 id="material-modal-title">Add material</h2>
                <p>Upload a PDF for this lesson. Students will be able to view it.</p>
            </div>
            <button class="modal-close" id="close-material-modal" onclick="closeAddMeterialModal()" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
            </button>
        </div>

        <div class="modal-body">
            <div class="form-section">
                <p class="form-section-title">PDF file</p>

                <label class="pdf-dropzone" id="pdf-dropzone-label" for="input-material-file">
                    <div class="pdf-dz-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                    </div>
                    <strong>Click to upload a PDF</strong>
                    <span>or drag and drop here</span>
                    <input type="file" id="input-material-file" accept=".pdf,video/*">
                </label>
            </div>
        </div>

        <div class="modal-foot">
            <button type="button" class="btn btn-ghost" id="cancel-material-modal" onclick="closeAddMaterialModal()">Cancel</button>
            <button type="button" class="btn btn-primary" id="save-material-btn" onclick="addMaterialBtn()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>
                Upload material
            </button>
        </div>
    </div>
</div>

<div class="toast-stack" id="toast-stack"></div>

<script src="lib/jquery-4.0.0.min.js"></script>
<script src="js/controller/lessonPdfController.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script src="js/apiHandle/lessonPdfAPI.js"></script>
</body>
</html>
